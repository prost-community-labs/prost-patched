[workspace]
members = [
  "benchmarks",
  "conformance",
  "prost-patched",
  "prost-patched-build",
  "prost-patched-derive",
  "prost-patched-types",
  "protobuf",
  "tests",
  "tests-2015",
  "tests-2018",
  "tests-2024",
  "tests-no-std",
  "tests/prost-path",
  "tests/reexported-prost",
  "tests/single-include",
  "fuzz",
]

resolver = "2"

[workspace.package]
version = "0.14.4"
authors = [
  "Dan Burkert <dan@danburkert.com>",
  "Lucio Franco <luciofranco14@gmail.com>",
  "Casper Meijn <casper@meijn.net>",
  "Tokio Contributors <team@tokio.rs>",
  "Blizzard Finnegan <blizzardfinnegan@protonmail.com>",
]
license = "Apache-2.0"
repository = "https://github.com/prost-community-labs/prost-patched"
rust-version = "1.85"
edition = "2021"

[profile.bench]
debug = true
